name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: yaad-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build dev image
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml build api

      - name: Run migrations
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml run --rm api npm run db:migrate

      - name: Run tests
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml run --rm api npm test

      - name: Build production image
        run: docker compose -f docker-compose.yml build api

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
