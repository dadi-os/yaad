name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: yaad-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.task }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [test, typecheck]

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yaad
          POSTGRES_PASSWORD: yaad
          POSTGRES_DB: yaad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yaad -d yaad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://yaad:yaad@localhost:5432/yaad
      DWAR_BASE_URL: http://localhost:9999
      HOST: 127.0.0.1
      PORT: "8090"
      LOG_LEVEL: silent

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run db:migrate

      - name: Typecheck
        if: matrix.task == 'typecheck'
        run: npm run build

      - name: Test
        if: matrix.task == 'test'
        run: npm test
