name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: yaad-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: yaad
          POSTGRES_PASSWORD: yaad
          POSTGRES_DB: yaad
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yaad -d yaad"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Build dev image
        run: docker build --target dev -t yaad-dev .

      - name: Migrate
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://yaad:yaad@localhost:5432/yaad \
            -v "$PWD:/app" -v /app/node_modules \
            yaad-dev npm run db:migrate

      - name: Test
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgres://yaad:yaad@localhost:5432/yaad \
            -v "$PWD:/app" -v /app/node_modules \
            yaad-dev npm test

      - name: Build production image
        run: docker build --target production -t yaad-prod .
