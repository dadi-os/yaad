name: yaad

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: yaad
      POSTGRES_PASSWORD: yaad
      POSTGRES_DB: yaad
    volumes:
      - yaad_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaad -d yaad"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgres://yaad:yaad@postgres:5432/yaad
      DWAR_BASE_URL: http://host.docker.internal:8080
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: info
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  yaad_pg:
